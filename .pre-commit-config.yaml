repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
  - repo: https://github.com/meta/pyrefly-pre-commit
    rev: 1.4.0
    hooks:
      - id: pyrefly-check
