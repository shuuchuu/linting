[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = []
description = "Exemple d'utilisation de quelques-uns des principaux outils de lint de Python."
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "linting"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/shuuchuu/linting"

[dependency-groups]
dev = [
  "pyrefly >= 1.4",
  "ruff >= 0.17",
]

[tool.ruff.lint]
extend-select = ["ANN", "E7"]

# Sans configuration, pyrefly retombe sur son préréglage « basic », indulgent.
# Avec une configuration, il ne traite plus la racine du projet comme une racine
# d'import : les tests ne pourraient pas importer tests.conftest sans search-path.
[tool.pyrefly]
search-path = ["."]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.6,<0.14.0"]
