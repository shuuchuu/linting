[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = []
description = "Example usage of some of the main Python linting tools."
homepage = "https://github.com/shuuchuu/linting"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "linting"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "pyrefly >= 1.4",
  "ruff >= 0.17",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
preview = true
select = ["ANN", "C901", "D", "DOC", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.mccabe]
# `remove_dependents` (complexity 5) is flagged up to a maximum of 4.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

# Without a config, pyrefly falls back to its lenient "basic" preset. With one,
# it stops treating the project root as an import root, so tests couldn't
# import tests.conftest without search-path.
[tool.pyrefly]
search-path = ["."]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.6,<0.14.0"]
